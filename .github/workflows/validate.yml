name: Validate MySkills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pinned OpenCode plugin API
        run: npm install --prefix .opencode --ignore-scripts --no-audit --no-fund

      - name: Validate native discovery and router inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          failures = []
          skills = {
              path.parent.name: path
              for path in root.glob("*/SKILL.md")
              if path.is_file()
          }

          if not skills:
              failures.append("No skill directories containing SKILL.md were found.")

          for dirname, path in sorted(skills.items()):
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0].strip() != "---":
                  failures.append(f"{path}: missing opening YAML front-matter delimiter")
                  continue
              try:
                  closing = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
              except StopIteration:
                  failures.append(f"{path}: missing closing YAML front-matter delimiter")
                  continue
              front = "\n".join(lines[1:closing])
              name = re.search(r"(?m)^name:\s*([a-z0-9-]+)\s*$", front)
              description = re.search(r"(?m)^description:\s*(\S.*)$", front)
              if not name or name.group(1) != dirname:
                  failures.append(f"{path}: name must match directory '{dirname}'")
              if not description:
                  failures.append(f"{path}: missing description")
              if len(lines) > 800:
                  failures.append(f"{path}: {len(lines)} lines exceeds the 800-line hard limit")

          try:
              native_config = json.loads(Path("opencode.jsonc").read_text(encoding="utf-8"))
          except Exception as exc:
              failures.append(f"opencode.jsonc is not strict JSON: {exc}")
              native_config = {}
          if "./" not in native_config.get("skills", []):
              failures.append("opencode.jsonc must register the repository root through native skills configuration")
          if native_config.get("permission", {}).get("skill", {}).get("*") != "allow":
              failures.append("opencode.jsonc must explicitly allow the discovered skill set")

          try:
              router_config = json.loads(Path("myskills.config.json").read_text(encoding="utf-8"))
          except Exception as exc:
              failures.append(f"myskills.config.json is invalid JSON: {exc}")
              router_config = {}
          routing = router_config.get("routing", {})
          triggers = routing.get("triggers", {})
          if set(triggers) != set(skills):
              failures.append(f"Router trigger inventory differs from skill directories: missing={sorted(set(skills)-set(triggers))}, stale={sorted(set(triggers)-set(skills))}")
          for name, keywords in triggers.items():
              if not isinstance(keywords, list) or not keywords or not all(isinstance(k, str) and k.strip() for k in keywords):
                  failures.append(f"Trigger keywords for {name} must be a non-empty list of strings")

          for required in [".opencode/plugins/myskills-runtime.js", "runtime/router-core.mjs", "AGENTS.md"]:
              if not Path(required).is_file():
                  failures.append(f"Missing runtime component: {required}")

          goli_path = root / "goli-mat-de" / "SKILL.md"
          if goli_path.is_file() and len(goli_path.read_text(encoding="utf-8").split()) > 750:
              failures.append("goli-mat-de/SKILL.md exceeds the 750-word core budget")

          if failures:
              print("VALIDATION FAILED:")
              for failure in failures:
                  print(f" - {failure}")
              sys.exit(1)

          print(f"Validated native discovery configuration and {len(skills)} skill/router entries.")
          print("Legacy auto_trigger/auto_unload fields are not interpreted as runtime controls.")
          PY

      - name: Run deterministic routing, evidence and reference tests
        run: node --test tests/runtime-router.test.mjs

      - name: Smoke-test the OpenCode plugin registration
        run: |
          node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import { MySkillsRuntime } from "./.opencode/plugins/myskills-runtime.js";
          const plugin = await MySkillsRuntime({ directory: process.cwd(), worktree: process.cwd() });
          assert.equal(typeof plugin.tool.myskills_route.execute, "function");
          assert.equal(typeof plugin["tool.execute.before"], "function");
          assert.equal(typeof plugin.event, "function");
          console.log("MySkills route tool and runtime guard registered.");
          JS
