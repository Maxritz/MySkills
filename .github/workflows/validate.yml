name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skill structure and loader configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          failures = []
          skills = {
              path.parent.name: path
              for path in root.glob("*/SKILL.md")
              if path.is_file()
          }

          if not skills:
              failures.append("No skill directories containing SKILL.md were found.")

          for dirname, path in sorted(skills.items()):
              content = path.read_text(encoding="utf-8")
              lines = content.splitlines()

              if not lines or lines[0].strip() != "---":
                  failures.append(f"{path}: missing opening YAML front-matter delimiter")
                  continue
              try:
                  closing = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
              except StopIteration:
                  failures.append(f"{path}: missing closing YAML front-matter delimiter")
                  continue

              front = "\n".join(lines[1:closing])
              name = re.search(r"(?m)^name:\s*([A-Za-z0-9._-]+)\s*$", front)
              description = re.search(r"(?m)^description:\s*(\S.*)$", front)

              if not name:
                  failures.append(f"{path}: missing single-line name")
              elif name.group(1) != dirname:
                  failures.append(f"{path}: name '{name.group(1)}' does not match folder '{dirname}'")
              if not description:
                  failures.append(f"{path}: missing description")
              if not re.search(r"(?m)^metadata:\s*$", front):
                  failures.append(f"{path}: missing metadata block")
              if not re.search(r"(?m)^  loading:\s*on-demand\s*$", front):
                  failures.append(f"{path}: missing metadata loading: on-demand")
              if not re.search(r"(?m)^  auto_unload:\s*true\s*$", front):
                  failures.append(f"{path}: missing metadata auto_unload: true")

              if len(lines) > 800:
                  failures.append(f"{path}: {len(lines)} lines exceeds the 800-line hard limit")
              elif len(lines) > 500:
                  print(f"WARNING: {path} has {len(lines)} lines (>500 suggested limit)")

          try:
              config = json.loads(Path("opencode.jsonc").read_text(encoding="utf-8"))
          except Exception as exc:
              failures.append(f"opencode.jsonc is not strict JSON: {exc}")
              config = {}

          skill_config = config.get("skill", {})
          auto = set(skill_config.get("auto_trigger", []))
          conditional = set(skill_config.get("conditional_load", []))
          duplicates = auto & conditional
          if duplicates:
              failures.append(f"Skills appear in auto_trigger and conditional_load: {sorted(duplicates)}")

          registered = auto | conditional
          for missing in sorted(registered - set(skills)):
              failures.append(f"Loader configuration references missing skill directory: {missing}")
          for unregistered in sorted(set(skills) - registered):
              failures.append(f"Skill directory is not registered in loader configuration: {unregistered}")

          triggers = skill_config.get("trigger_keywords", {})
          for name, keywords in triggers.items():
              if name not in skills:
                  failures.append(f"Trigger map references missing skill directory: {name}")
              if not isinstance(keywords, list) or not all(isinstance(k, str) and k.strip() for k in keywords):
                  failures.append(f"Trigger keywords for {name} must be a list of non-empty strings")

          if failures:
              print("VALIDATION FAILED:")
              for failure in failures:
                  print(f" - {failure}")
              sys.exit(1)

          print(f"Validated {len(skills)} skills and loader references.")
          print(f"Auto-trigger: {len(auto)}; conditional-load: {len(conditional)}.")
          PY
