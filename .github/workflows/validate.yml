name: Validate MySkills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pinned OpenCode plugin API
        run: npm install --prefix .opencode --ignore-scripts --no-audit --no-fund

      - name: Validate native discovery and router inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          failures = []
          skills = {p.parent.name: p for p in root.glob("*/SKILL.md") if p.is_file()}
          if not skills:
              failures.append("No skill directories containing SKILL.md were found.")

          for dirname, path in sorted(skills.items()):
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0].strip() != "---":
                  failures.append(f"{path}: missing opening YAML front-matter delimiter")
                  continue
              try:
                  closing = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
              except StopIteration:
                  failures.append(f"{path}: missing closing YAML front-matter delimiter")
                  continue
              front = "\n".join(lines[1:closing])
              name = re.search(r"(?m)^name:\s*([a-z0-9-]+)\s*$", front)
              description = re.search(r"(?m)^description:\s*(\S.*)$", front)
              if not name or name.group(1) != dirname:
                  failures.append(f"{path}: name must match directory '{dirname}'")
              if not description:
                  failures.append(f"{path}: missing description")
              unsupported = re.findall(r"(?m)^  (auto_trigger|auto_unload|trigger_keywords|loading|priority):", front)
              if unsupported:
                  failures.append(f"{path}: remove unsupported OpenCode loader metadata: {sorted(set(unsupported))}")
              if len(lines) > 800:
                  failures.append(f"{path}: {len(lines)} lines exceeds the 800-line hard limit")

          try:
              native_config = json.loads(Path("opencode.jsonc").read_text(encoding="utf-8"))
          except Exception as exc:
              failures.append(f"opencode.jsonc is not strict JSON: {exc}")
              native_config = {}
          if "./" not in native_config.get("skills", []):
              failures.append('opencode.jsonc must register the root through skills: ["./"]')
          if native_config.get("permission", {}).get("skill", {}).get("*") != "allow":
              failures.append("opencode.jsonc must allow the discovered skill set")

          try:
              router_config = json.loads(Path("myskills.config.json").read_text(encoding="utf-8"))
          except Exception as exc:
              failures.append(f"myskills.config.json is invalid JSON: {exc}")
              router_config = {}
          triggers = router_config.get("routing", {}).get("triggers", {})
          if set(triggers) != set(skills):
              failures.append(f"Router inventory mismatch: missing={sorted(set(skills)-set(triggers))}, stale={sorted(set(triggers)-set(skills))}")
          for name, keywords in triggers.items():
              if not isinstance(keywords, list) or not keywords or not all(isinstance(k, str) and k.strip() for k in keywords):
                  failures.append(f"Trigger keywords for {name} must be a non-empty list of strings")

          for required in [".opencode/plugins/myskills-runtime.js", "runtime/router-core.mjs", "AGENTS.md", "SKILL_QUALITY_STANDARD.md"]:
              if not Path(required).is_file():
                  failures.append(f"Missing runtime/shared instruction file: {required}")

          goli_path = root / "goli-mat-de" / "SKILL.md"
          if goli_path.is_file() and len(goli_path.read_text(encoding="utf-8").split()) > 750:
              failures.append("goli-mat-de/SKILL.md exceeds the 750-word core budget")

          category_text = Path("SKILL_CATEGORIES.md").read_text(encoding="utf-8")
          category_entries = re.findall(r"(?m)^- ([a-z0-9-]+)\s*$", category_text)
          if len(category_entries) != len(set(category_entries)):
              failures.append("SKILL_CATEGORIES.md contains duplicate entries")
          if set(category_entries) != set(skills):
              failures.append(f"Category map mismatch: missing={sorted(set(skills)-set(category_entries))}, stale={sorted(set(category_entries)-set(skills))}")

          for source in root.glob("**/*.md"):
              if source.parts[0] in {".git", ".opencode", "node_modules"}:
                  continue
              body = source.read_text(encoding="utf-8")
              for target in re.findall(r"!?\[[^\]]*\]\(([^)]+)\)", body):
                  target = target.split("#", 1)[0].strip()
                  if not target or "://" in target or target.startswith("mailto:") or target.startswith("#"):
                      continue
                  resolved = (source.parent / target).resolve()
                  if not resolved.exists():
                      failures.append(f"{source}: broken relative link target {target}")

          if failures:
              print("VALIDATION FAILED:")
              for failure in failures:
                  print(" -", failure)
              sys.exit(1)
          print(f"Validated {len(skills)} skill directories, native discovery, router inventory, category parity and relative links.")
          PY

      - name: Run deterministic routing, evidence and reference tests
        run: node --test tests/runtime-router.test.mjs

      - name: Smoke-test OpenCode plugin registration and gates
        run: |
          node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import { MySkillsRuntime } from "./.opencode/plugins/myskills-runtime.js";
          const plugin = await MySkillsRuntime({ directory: process.cwd(), worktree: process.cwd() });
          assert.equal(typeof plugin.tool.myskills_route.execute, "function");
          assert.equal(typeof plugin["tool.execute.before"], "function");
          assert.equal(typeof plugin.event, "function");
          await assert.rejects(
            () => plugin["tool.execute.before"]({ tool: "read", sessionID: "smoke" }, { args: { filePath: "README.md" } }),
            /call myskills_route/,
            "unrouted session should not use tools"
          );
          const routed = await plugin.tool.myskills_route.execute(
            { task: "Implement a Vulkan compute shader fix with semaphore synchronisation.", max_skills: 4 },
            { sessionID: "smoke", directory: process.cwd(), worktree: process.cwd() }
          );
          assert.match(routed, /LOADED code-quality-gate/);
          assert.match(routed, /LOADED vulkan-compute-stack/);
          await plugin["tool.execute.before"]({ tool: "edit", sessionID: "smoke" }, { args: { filePath: "src/example.cpp" } });
          console.log("MySkills router and gate smoke test passed.");
          JS
