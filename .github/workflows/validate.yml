name: Validate MySkills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pinned OpenCode plugin API
        working-directory: .opencode
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate native discovery and router inventory
        shell: bash
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path

          root = Path(".")
          failures = []
          skills = {p.parent.name: p for p in root.glob("*/SKILL.md") if p.is_file()}
          if not skills:
              failures.append("No skill directories containing SKILL.md were found.")

          for name, path in sorted(skills.items()):
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0].strip() != "---":
                  failures.append(f"{path}: missing opening front-matter delimiter")
                  continue
              try:
                  closing = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
              except StopIteration:
                  failures.append(f"{path}: missing closing front-matter delimiter")
                  continue
              front = "\n".join(lines[1:closing])
              found_name = re.search(r"(?m)^name:\s*([a-z0-9-]+)\s*$", front)
              description = re.search(r"(?m)^description:\s*(\S.*)$", front)
              if not found_name or found_name.group(1) != name:
                  failures.append(f"{path}: name must match directory '{name}'")
              if not description:
                  failures.append(f"{path}: missing description")
              if len(lines) > 800:
                  failures.append(f"{path}: exceeds 800 lines ({len(lines)})")

          try:
              native = json.loads(Path("opencode.jsonc").read_text(encoding="utf-8"))
          except Exception as exc:
              native = {}
              failures.append(f"opencode.jsonc is not strict JSON: {exc}")
          if "./" not in native.get("skills", []):
              failures.append('opencode.jsonc must declare skills: ["./"]')
          if native.get("permission", {}).get("skill", {}).get("*") != "allow":
              failures.append("opencode.jsonc must allow discovered skills")
          if "SKILL_QUALITY_STANDARD.md" not in native.get("instructions", []):
              failures.append("Shared SKILL_QUALITY_STANDARD.md instruction must be configured")

          try:
              router = json.loads(Path("myskills.config.json").read_text(encoding="utf-8"))
              triggers = router.get("routing", {}).get("triggers", {})
          except Exception as exc:
              triggers = {}
              failures.append(f"myskills.config.json is invalid JSON: {exc}")
          if set(triggers) != set(skills):
              failures.append(f"Router inventory mismatch: missing={sorted(set(skills)-set(triggers))}, stale={sorted(set(triggers)-set(skills))}")
          for name, words in triggers.items():
              if not isinstance(words, list) or not words or not all(isinstance(w, str) and w.strip() for w in words):
                  failures.append(f"Router triggers for {name} must be a non-empty list of strings")

          for required in [".opencode/plugins/myskills-runtime.js", "runtime/router-core.mjs", "AGENTS.md", "SKILL_QUALITY_STANDARD.md"]:
              if not Path(required).is_file():
                  failures.append(f"Missing runtime/shared instruction file: {required}")

          goli = root / "goli-mat-de" / "SKILL.md"
          if goli.is_file() and len(goli.read_text(encoding="utf-8").split()) > 750:
              failures.append("goli-mat-de/SKILL.md exceeds the 750-word core budget")

          category_text = Path("SKILL_CATEGORIES.md").read_text(encoding="utf-8")
          categories = re.findall(r"(?m)^- ([a-z0-9-]+)\s*$", category_text)
          if len(categories) != len(set(categories)):
              failures.append("SKILL_CATEGORIES.md contains duplicate entries")
          if set(categories) != set(skills):
              failures.append(f"Category mismatch: missing={sorted(set(skills)-set(categories))}, stale={sorted(set(categories)-set(skills))}")

          if failures:
              print("VALIDATION FAILED:")
              for failure in failures:
                  print(" -", failure)
              sys.exit(1)
          print(f"Validated {len(skills)} skill directories, native discovery, {len(triggers)} routes and category parity.")
          PY

      - name: Run deterministic routing, evidence and reference tests
        run: node --test tests/runtime-router.test.mjs

      - name: Check OpenCode plugin registration
        run: |
          node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import { MySkillsRuntime } from "./.opencode/plugins/myskills-runtime.js";
          const plugin = await MySkillsRuntime({ directory: process.cwd(), worktree: process.cwd() });
          assert.equal(typeof plugin.tool.myskills_route.execute, "function");
          assert.equal(typeof plugin["tool.execute.before"], "function");
          assert.equal(typeof plugin.event, "function");
          console.log("MySkills plugin registered its route, pre-tool gate and event hook.");
          JS
